<script>
  // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxtvfJUN1rGAcQ4e9kje5BYJgmg7DpgxVCJqVbRQcTkEzlT_PFQuM0aKhPyDTKFzdr2/exec";

  // KODE BARU
let photoData = null;
let video, previewImg, canvas, btnCapture, btnRetake, photoStatus, btnSubmit;
let autoRefreshInterval = null;

// Jalankan setelah seluruh elemen HTML dimuat sempurna
document.addEventListener('DOMContentLoaded', function() {
  video = document.getElementById('webcam');
  previewImg = document.getElementById('previewImg');
  canvas = document.getElementById('canvas');
  btnCapture = document.getElementById('btnCapture');
  btnRetake = document.getElementById('btnRetake');
  photoStatus = document.getElementById('photoStatus');
  btnSubmit = document.getElementById('btnSubmit');

  initCamera();
});

function initCamera() {
  if (!video) return;
  
  const constraints = {
    video: {
      facingMode: "user",
      width: { ideal: 640 },
      height: { ideal: 480 }
    }
  };

  navigator.mediaDevices.getUserMedia(constraints)
    .then(stream => { 
      video.srcObject = stream; 
    })
    .catch(err => {
      console.error("Detail Error Kamera:", err);
      alert("Gagal mengakses kamera: " + err.message + "\n\nPastikan Anda menggunakan HTTPS dan telah memberikan izin kamera di browser.");
    });
}

  // Kompresi Foto agar URL JSONP tidak terlalu panjang
  function takeSnapshot() {
    canvas.width = 320;
    canvas.height = 240;
    let context = canvas.getContext('2d');
    context.translate(canvas.width, 0);
    context.scale(-1, 1);
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Kualitas diset ke 0.5 agar resolusi foto pas dikirim via URL GET
    photoData = canvas.toDataURL('image/jpeg', 0.5);

    previewImg.src = photoData;
    previewImg.style.display = 'block';
    video.style.display = 'none';

    btnCapture.classList.add('d-none');
    btnRetake.classList.remove('d-none');

    photoStatus.innerText = "✓ Foto Berhasil Diambil";
    photoStatus.className = "text-success d-block mt-1";
    btnSubmit.disabled = false;
  }

  function resetCamera() {
    photoData = null;
    previewImg.style.display = 'none';
    video.style.display = 'block';

    btnRetake.classList.add('d-none');
    btnCapture.classList.remove('d-none');

    photoStatus.innerText = "Foto belum diambil";
    photoStatus.className = "text-danger d-block mt-1";
    btnSubmit.disabled = true;
  }

  // --- HELPER UTAMA JSONP ---
  function executeJSONP(url, params, callbackName) {
    const query = new URLSearchParams(params);
    query.append('callback', callbackName);

    const script = document.createElement('script');
    script.src = `${url}?${query.toString()}`;
    script.id = 'jsonp_' + callbackName;

    // Bersihkan tag script lama jika ada
    const oldScript = document.getElementById(script.id);
    if (oldScript) oldScript.remove();

    document.body.appendChild(script);
  }

  // --- 1. PROSES SUBMIT PRESENSI ---
  document.getElementById('attendanceForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if (!photoData) return alert("Silakan ambil foto selfie terlebih dahulu.");

    btnSubmit.disabled = true;
    btnSubmit.innerText = "Mengirim...";

    const params = {
      action: 'simpan',
      //namaAcara: document.getElementById('namaAcara').value,
      nama: document.getElementById('nama').value,
      asal: document.getElementById('asal').value,
      image: photoData
    };

    // Panggil JSONP
    executeJSONP(GAS_URL, params, 'onPresensiSubmitted');
  });

  // Callback dari Server setelah Submit
  window.onPresensiSubmitted = function(response) {
    if (response.status === 'success') {
      alert("Presensi Berhasil Dikirim!");
      document.getElementById('nama').value = '';
      document.getElementById('asal').value = '';
      resetCamera();
    } else {
      alert("Gagal menyimpan presensi: " + response.message);
    }
    btnSubmit.disabled = false;
    btnSubmit.innerText = "Kirim Presensi";
  };

  // --- 2. PROSES UPDATE PROYEKTOR ---
  function fetchLastParticipant() {
    executeJSONP(GAS_URL, { action: 'getLast' }, 'onGetLastParticipant');
  }

  // Callback dari Server untuk Tampilan Proyektor
  window.onGetLastParticipant = function(data) {
    if (data && data.status === 'success') {
      document.getElementById('dispAcara').innerText = data.namaAcara || "Selamat Datang";
      document.getElementById('dispNama').innerText = data.nama;
      document.getElementById('dispAsal').innerText = data.asal;
      document.getElementById('dispFoto').src = data.photoUrl;
      document.getElementById('dispWaktu').innerText = "Hadir pada: " + data.waktu;
    }
  };

  // Navigasi Tampilan
  function switchMode(mode) {
    if (mode === 'proyektor') {
      document.getElementById('form-section').classList.add('d-none');
      document.getElementById('proyektor-section').classList.remove('d-none');
      fetchLastParticipant();
      autoRefreshInterval = setInterval(fetchLastParticipant, 3000);
    } else {
      document.getElementById('proyektor-section').classList.add('d-none');
      document.getElementById('form-section').classList.remove('d-none');
      if (autoRefreshInterval) clearInterval(autoRefreshInterval);
    }
  }
</script>
