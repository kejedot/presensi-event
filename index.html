<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Presensi Digital</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <div class="header">


        <img 
        src="assets/logo.png"
        class="logo">


        <h1 id="namaAplikasi"></h1>


        <h2 id="namaAcara"></h2>


        <p id="detailAcara"></p>


    </div>



    <div class="card">

            <!-- DESKRIPSI KEGIATAN -->

        <div class="event-description">

            <strong></strong><p id="deskripsi"></p></strong>

        </div>




        <div class="photo-wrapper">

        <!-- SPACE PANDUAN FOTO -->

            <div class="photo-guide">

                <strong>
                Panduan Foto:
                </strong>

                <ul id="panduanFoto">

                </ul>

            </div>

        
            <!-- AREA KAMERA -->
    
            <div class="photo-box">

                <video 
                id="camera"
                autoplay
                playsinline>
                </video>


                <img 
                id="preview"
                class="preview">


            <!-- Panduan wajah -->

            <div class="face-guide">

                <div class="face-circle"></div>

                </div>

            </div>


            <button 
            id="photoBtn"
            class="btn photo-btn">

                📷 Ambil Foto

            </button>



            <canvas 
            id="canvas"
            hidden>
            </canvas>




            <!-- FORM -->


            <label>
                Nama Lengkap
            </label>

            <input 
            type="text"
            id="nama"
            placeholder="Masukkan nama">

            <label>
                Kabupaten/Kota
            </label>


            <select id="kota">

                <option value="">
                    Pilih Kabupaten/Kota
                </option>

            </select>


            <button
            id="submitBtn"
            class="btn submit-btn"
            disabled>

                Kirim Presensi

            </button>

        </div>


</div>

    
    <footer>

        © 2026 Presensi Digital<br>
        Sekretariat DPW PKS Jateng

    </footer>




<script src="config.js"></script>

<script src="script.js"></script>

</body>

</html>
