<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" 
content="width=device-width, initial-scale=1.0">

<title>
Presensi Kehadiran
</title>

<link rel="stylesheet" href="style.css">
</head>


<body>
<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>
            Presensi Kehadiran
        </h1>
        <p>
            Silakan isi data dan ambil foto selfie
        </p>
    </div>

    <!-- FORM -->
    <div class="form-group">
        <label>
            Nama Lengkap
        </label>
        <input 
        type="text"
        id="nama"
        placeholder="Masukkan nama">
    </div>

    <div class="form-group">
        <label>
            Asal Lembaga / Instansi
        </label>

        <input 
        type="text"
        id="asal"
        placeholder="Masukkan asal lembaga">
    </div>

    <!-- CAMERA -->
    <div class="form-group">

        <label>
            Foto Selfie
        </label>

        <div class="camera-box">
            <video 
            id="video"
            autoplay
            playsinline>
            </video>

            <canvas 
            id="canvas">
            </canvas>
        </div>

        <img 
        id="preview"
        class="preview">

    </div>

    <!-- BUTTON -->

    <button 
    id="btnCamera"
    class="btn-camera">

        Ambil Foto

    </button>

    <button 
    id="btnSubmit"
    class="btn-submit">

        Kirim Presensi

    </button>

    <div class="loading"
    id="loading">

        Mengirim data...

    </div>
</div>
<script src="script.js"></script>
</body>
</html>
