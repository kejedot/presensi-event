<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Presensi Digital</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <div class="header">

        <img src="assets/logo.png" class="logo">

        <h1>
            PRESENSI DIGITAL
        </h1>

        <p>
            Silakan lengkapi data dan ambil foto selfie
        </p>

    </div>



    <div class="card">


        <!-- FOTO -->

        <div class="photo-box">

            <video 
                id="camera"
                autoplay
                playsinline>
            </video>


            <img 
                id="preview"
                class="preview">


        </div>



        <button 
        id="photoBtn"
        class="btn photo-btn">

            📷 Ambil Foto

        </button>



        <canvas 
        id="canvas"
        hidden>
        </canvas>




        <!-- FORM -->


        <label>
            Nama Lengkap
        </label>

        <input 
        type="text"
        id="nama"
        placeholder="Masukkan nama">


        

        <label>
            Kabupaten/Kota
        </label>


        <select id="kota">

            <option value="">
                Pilih Kabupaten/Kota
            </option>

        </select>




        <button
        id="submitBtn"
        class="btn submit-btn"
        disabled>

            Kirim Presensi

        </button>



    </div>



    <footer>

        © 2026 Presensi Digital

    </footer>



</div>



<script src="script.js"></script>


</body>

</html>
