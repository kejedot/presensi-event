<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Presensi Kehadiran</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Presensi Kehadiran</h1>
    <p class="subtitle">
        Silakan isi data dan ambil foto selfie
    </p>

    <!-- FORM -->

    <div class="form-group">

        <label>Nama Lengkap</label>

        <input
            type="text"
            id="nama"
            placeholder="Masukkan nama lengkap"
            autocomplete="off"
            required>

    </div>

    <div class="form-group">

        <label>Asal / Instansi</label>

        <input
            type="text"
            id="asal"
            placeholder="Masukkan asal lembaga"
            autocomplete="off"
            required>

    </div>

    <!-- AREA KAMERA -->

    <div class="camera-wrapper">

        <!-- Kamera langsung aktif -->

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <!-- Preview setelah foto -->

        <img
            id="previewFoto"
            alt="Preview Foto">

        <!-- Canvas tersembunyi -->

        <canvas
            id="canvas"
            style="display:none;">
        </canvas>

    </div>

    <!-- Tombol -->

    <div class="button-group">

        <button
            id="btnCapture"
            type="button">

            📸 Ambil Foto

        </button>

        <button
            id="btnRetake"
            type="button"
            disabled>

            🔄 Ulangi Foto

        </button>

        <button
            id="btnSubmit"
            type="button"
            disabled>

            ✅ Kirim Presensi

        </button>

    </div>

    <!-- Loading -->

    <div
        id="loading"
        style="display:none;">

        <p>Mengirim data...</p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
