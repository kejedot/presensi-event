```html
<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Presensi Kehadiran</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">

            <h1>Presensi Kehadiran</h1>

            <p>Silakan isi data dan ambil foto selfie</p>

        </div>


        <div class="form-group">

            <label>Nama Lengkap</label>

            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama lengkap">

        </div>



        <div class="form-group">

            <label>Asal / Instansi</label>

            <input
                type="text"
                id="asal"
                placeholder="Masukkan asal lembaga">

        </div>



        <div class="camera-container">

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>

            <canvas id="canvas"></canvas>

            <img
                id="preview"
                alt="Preview Foto">

        </div>



        <div class="button-group">

            <button
                id="btnOpenCamera"
                class="btn btn-primary">

                📷 Buka Kamera

            </button>


            <button
                id="btnCapture"
                class="btn btn-warning"
                disabled>

                📸 Ambil Foto

            </button>


            <button
                id="btnRetake"
                class="btn btn-secondary"
                disabled>

                🔄 Ulangi Foto

            </button>


            <button
                id="btnSubmit"
                class="btn btn-success"
                disabled>

                ✅ Kirim Presensi

            </button>

        </div>



        <div
            id="loading"
            class="loading">

            <div class="spinner"></div>

            <span>Mengirim data...</span>

        </div>



        <div
            id="message"
            class="message">

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
```
