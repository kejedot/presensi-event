<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Presensi Mandiri</title>
    <!-- Menggunakan Tailwind CSS Publik -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div class="max-w-6xl mx-auto px-4 py-10">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-blue-900 dynamic-title">Dasbor Log Foto Presensi</h1>
            <p class="text-slate-500 mt-2 text-sm md:text-base">Aset selfie kehadiran terenkripsi & tersinkronisasi di GitHub Enterprise</p>
        </header>

        <!-- Container Utama Galeri -->
        <div id="box-galeri" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Tampilan Awal Memuat Data -->
            <div id="status-sinkron" class="col-span-full text-center py-20 text-slate-400 animate-pulse font-medium">
                Menghubungkan ke server repositori, memuat gambar...
            </div>
        </div>
    </div>

    <script>
        // ==================== KONFIGURASI REPO ====================
        const USER_GITHUB = "kejedot"; // Ganti dengan username GitHub Anda
        const NAMA_REPO  = "presensi-event"; // Ganti dengan nama repositori GitHub Anda
        const FOLDER_FOTO = "uploads";             // Nama folder penyimpanan di dalam repositori
        // ==========================================================

        async function muatFotoPresensi() {
            const galeri = document.getElementById('box-galeri');
            
            try {
                const endpoint = `https://github.com{USER_GITHUB}/${NAMA_REPO}/contents/${FOLDER_FOTO}`;
                const respon = await fetch(endpoint);
                
                if (!respon.ok) {
                    throw new Error("Folder penyimpanan kosong atau repositori belum diatur.");
                }
                
                const daftarFile = await respon.json();
                galeri.innerHTML = ""; // Bersihkan pesan memuat data
                
                // Memfilter file berformat gambar saja
                const fileGambar = daftarFile.filter(item => item.name.match(/\.(jpg|jpeg|png|webp|gif)$/i));

                if (fileGambar.length === 0) {
                    galeri.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400">Belum ada log foto presensi yang terunggah ke folder '${FOLDER_FOTO}'.</div>`;
                    return;
                }

                // Buat komponen visual kartu untuk tiap foto
                fileGambar.forEach(file => {
                    // Mengurai nama file (Format: ID_Nama_Karyawan.png)
                    const uraianNama = file.name.split('.')[0].replace(/_/g, ' ');
                    
                    const kartu = document.createElement('div');
                    kartu.className = "bg-white border border-slate-200 rounded-2xl p-3 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col";
                    
                    kartu.innerHTML = `
                        <div class="w-full h-48 bg-slate-100 rounded-xl overflow-hidden mb-3 relative">
                            <img src="${file.download_url}" alt="Selfie Presensi" class="w-full h-full object-cover">
                        </div>
                        <div class="mt-auto">
                            <div class="flex items-center justify-between mb-2">
                                <span class="bg-blue-50 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
                                    GitHub Cloud
                                </span>
                            </div>
                            <h3 class="font-bold text-slate-700 text-sm truncate" title="${uraianNama}">
                                ${uraianNama}
                            </h3>
                            <a href="${file.download_url}" target="_blank" class="mt-3 w-full block text-center text-xs font-semibold bg-slate-800 hover:bg-slate-900 text-white py-2 rounded-lg transition-colors">
                                Lihat Foto Asli
                            </a>
                        </div>
                    `;
                    galeri.appendChild(kartu);
                });

            } catch (kesalahan) {
                console.error(kesalahan);
                galeri.innerHTML = `<div class="col-span-full text-center py-16 text-red-500 font-semibold">Gagal memuat log data: ${kesalahan.message}</div>`;
            }
        }

        document.addEventListener("DOMContentLoaded", muatFotoPresensi);
    </script>
</body>
</html>
